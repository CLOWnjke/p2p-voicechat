[package]
name = "voicechat"
version = "0.1.0"
edition = "2021"
description = "Маленький голосовой чат для друзей: один exe, без хостинга"

[dependencies]
# glow вместо wgpu: меньше зависимостей и надёжнее на старых видеодрайверах.
# x11/wayland ничего не значат на Windows, но нужны для сборки под Linux.
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
] }
cpal = "0.18"
opus = "0.4"
igd-next = "0.17"
base64 = "0.23"
anyhow = "1"
nnnoiseless = "0.5"
ed25519-dalek = "3"
getrandom = "0.3"
device_query = "4"
directories = "6"
decibri-aec = "0.2"
ndarray = "0.15"

# DeepFilterNet: на crates.io лежит только DSP-часть, рантайм инференса живёт
# в репозитории. Версии tract закреплены жёстко: на более новых репозиторий
# не собирается, там переименовали поле в публичном API.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d", default-features = false, features = ["tract", "default-model"] }
tract-core = "=0.21.4"
tract-onnx = "=0.21.4"
tract-pulse = "=0.21.4"
tract-hir = "=0.21.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
